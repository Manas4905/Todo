<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A beautiful, accessible To-Do List app to manage your daily tasks."
    />
    <title>Crème:To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div
      id="live-region"
      aria-live="polite"
      aria-atomic="true"
      role="status"
    ></div>

    <!-- Skip navigation -->
    <a href="#task-input" class="skip-link">Skip to task input</a>

    <main class="app" id="main">
      <header>
        <div class="header-badge" aria-hidden="true">Your Daily Ritual</div>
        <h1>My <em>Tasks</em></h1>
        <p class="subtitle">Calm focus, one task at a time.</p>
      </header>

      <div class="stats" aria-label="Task summary">
        <div class="stat-pill">
          <span class="stat-dot" aria-hidden="true"></span>
          <strong id="total-count">0</strong> total
        </div>
        <div class="stat-pill">
          <span class="stat-dot done" aria-hidden="true"></span>
          <strong id="done-count">0</strong> done
        </div>
        <div class="stat-pill">
          <span
            class="stat-dot"
            style="background: red"
            aria-hidden="true"
          ></span>
          <strong id="remaining-count">0</strong> left
        </div>
      </div>

      <div class="input-card">
        <div class="input-row">
          <label for="task-input" class="sr-only">New task</label>
          <input
            type="text"
            id="task-input"
            placeholder="What needs to be done?"
            maxlength="200"
            autocomplete="off"
            aria-label="Enter a new task"
          />
          <button class="add-btn" id="add-btn" aria-label="Add task">
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M8 1v14M1 8h14"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            Add Task
          </button>
        </div>
      </div>

      <div class="filter-bar" role="group" aria-label="Filter tasks">
        <button class="filter-btn active" data-filter="all" aria-pressed="true">
          All
        </button>
        <button class="filter-btn" data-filter="active" aria-pressed="false">
          Active
        </button>
        <button class="filter-btn" data-filter="completed" aria-pressed="false">
          Completed
        </button>
      </div>

      <ul id="task-list" aria-label="Task list" aria-live="polite"></ul>

      <div class="footer-bar">
        <button
          class="clear-btn"
          id="clear-btn"
          aria-label="Clear all completed tasks"
          disabled
        >
          Clear completed
        </button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
